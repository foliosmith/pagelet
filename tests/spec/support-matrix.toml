schema_version = 1

[[features]]
id = "EPUB-PKG-CONTAINER"
profile = "EPUB 2.0.1"
status = "SupportedWithLimitations"
notes = "Initial fixture coverage only."

[[features]]
id = "EPUB-PKG-CONTAINER"
profile = "EPUB 3.0-3.3"
status = "SupportedWithLimitations"
notes = "Initial fixture coverage only."

[[features]]
id = "EPUB-PKG-CONTAINER"
profile = "EPUB 3.4"
status = "UnsupportedDiagnosed"
notes = "Tracked as experimental until test suite is pinned."

[[features]]
id = "EPUB-RESOURCE-LIMITS"
profile = "EPUB 3.0-3.3"
status = "RejectedForSecurity"
notes = "Zip bomb-like fixtures exercise the policy surface."

[[features]]
id = "EPUB-OCF-ZIP"
profile = "EPUB 2.0.1-3.3"
status = "SupportedWithLimitations"
notes = "Stored and deflate entries are read lazily under fixed resource limits."

[[features]]
id = "EPUB-PKG-METADATA"
profile = "EPUB 2.0.1-3.3"
status = "SupportedWithLimitations"
notes = "Core identifier, title, language and cover metadata are exposed."

[[features]]
id = "EPUB-PKG-SPINE"
profile = "EPUB 2.0.1-3.3"
status = "Supported"
notes = "Manifest-backed spine order, linearity and progression direction are retained."

[[features]]
id = "EPUB-NAV-TOC"
profile = "EPUB 2.0.1-3.3"
status = "SupportedWithLimitations"
notes = "EPUB 3 nav and EPUB 2 NCX hierarchy are exposed; full reading-system UI behavior is out of scope."

[[features]]
id = "EPUB-CONTENT-XHTML"
profile = "EPUB 2.0.1-3.3"
status = "SupportedWithLimitations"
notes = "Supported semantic nodes map to ChapterIR; unsupported presentation is diagnosed or omitted."

[[features]]
id = "EPUB-CSS-CASCADE"
profile = "EPUB 3.0-3.3"
status = "SupportedWithLimitations"
notes = "A bounded layout-facing property subset supports cascade, inheritance and inline styles."

[[features]]
id = "EPUB-CSS-WRITING-MODE"
profile = "EPUB 3.0-3.3"
status = "ParsedNotRendered"
notes = "writing-mode is retained in computed style; vertical layout remains a manual compatibility gap."

[[features]]
id = "EPUB-NOTES-FOOTNOTE"
profile = "EPUB 3.0-3.3"
status = "SupportedWithLimitations"
notes = "Referenced local and external notes become semantic footnotes with backlinks; page-bottom placement is deferred."

[[features]]
id = "EPUB-RESOURCE-IMAGE"
profile = "EPUB 2.0.1-3.3"
status = "SupportedWithLimitations"
notes = "PNG, GIF and JPEG intrinsic sizes participate in layout; SVG content documents remain deferred."

[[features]]
id = "EPUB-SCRIPTING"
profile = "EPUB 3.0-3.3"
status = "ParsedNotRendered"
notes = "Script nodes do not enter visible content and JavaScript is never executed."
