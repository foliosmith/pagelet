name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache pinned external suites
        uses: actions/cache@v4
        with:
          path: target/pagelet-external
          key: pagelet-conformance-${{ hashFiles('tests/corpus-manifest.toml') }}

      - name: Install release policy tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps

      - name: License and source policy
        run: cargo deny check

      - name: Advisory audit
        run: cargo audit

      - name: Sync and verify pinned conformance suites
        run: |
          cargo xtask external sync --locked
          cargo xtask external verify

      - name: Compatibility and corpus gates
        run: |
          cargo xtask manifests lint
          cargo xtask w3c --profile required --required
          cargo xtask epubcheck --fixtures valid,invalid --required
          cargo xtask corpus --profile full --required

      - name: Generate performance report
        run: >-
          cargo run --release -p xtask -- bench report
          --profile smoke
          --samples 5
          --runner github-release-observe
          --incremental-cases

      - name: Verify publish package
        run: cargo xtask release dry-run

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagelet-release-evidence
          path: |
            target/pagelet-conformance/*.json
            target/pagelet-conformance/*.md
            target/pagelet-corpus/*.json
            target/pagelet-corpus/*.md
            target/pagelet-bench/current.csv
            target/pagelet-bench/report.md

  flutter:
    name: Flutter ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-latest
            target: ios
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: dart packages/pagelet_flutter/tool/build_smoke.dart ${{ matrix.target }}
