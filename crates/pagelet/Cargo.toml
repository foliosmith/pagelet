[package]
name = "pagelet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic EPUB parsing and pagination engine."
readme = "README.md"
documentation = "https://docs.rs/pagelet"
keywords = ["epub", "pagination", "layout", "reader"]
categories = ["parser-implementations", "rendering", "text-processing"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
native-shaping = ["dep:ttf-parser"]

[dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
ttf-parser = { version = "0.25.1", optional = true, default-features = false, features = ["std"] }

[[bench]]
name = "fixture_generation"
harness = false

[lints]
workspace = true
